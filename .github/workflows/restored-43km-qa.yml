name: Restored 43 km GPX source and maps QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/participant-gpx/**'
      - 'data/normalized-gpx/**'
      - 'docs/data/**'
      - 'config/**'
      - 'tools/rebuild_owner_normalized_43.py'
      - 'tests/test_restored_43km_gpx.py'
      - '.github/workflows/restored-43km-qa.yml'
permissions:
  contents: read
jobs:
  historical-trail43:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GPX reconstruction and browser test dependencies
        run: |
          python -m pip install numpy scipy playwright
          python -m playwright install --with-deps chromium
      - name: Exact original hashes and new route contracts
        run: |
          python tests/test_restored_43km_gpx.py
          python tools/rebuild_owner_normalized_43.py
          git diff --exit-code -- data/normalized-gpx/
      - name: Independent complete release source integrity
        run: |
          node --check docs/assets/app.js
          python tools/run_release_candidate_checks.py --source
      - name: Browser checks for 2024 sparse checkpoints and all historical editions
        run: |
          SATILA_SITE=docs python tests/browser_2024_course_acceptance.py
          SATILA_SITE=docs python tests/browser_all_editions_acceptance.py
