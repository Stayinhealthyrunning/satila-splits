name: Codex + independent QA integration
on:
  push:
    branches: [integration/codex-independent-qa-2026-10-01]
    paths:
      - ".github/workflows/integration-candidate.yml"
      - "tests/**"
      - "tools/**"
      - "docs/**"
      - "config/**"
      - "BUILD_STATE.json"
      - "qa.integration.trigger"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: satila-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-and-method:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: All independent source, statistical and release-static tests
        run: |
          set -o pipefail
          python tools/run_release_candidate_checks.py --source --json-output /tmp/satila-source-checks.json 2>&1 | tee /tmp/satila-source-checks.log
      - name: Preserve source audit and first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-source-report
          path: |
            /tmp/satila-source-checks.json
            /tmp/satila-source-checks.log
          if-no-files-found: warn
          retention-days: 14
  browser-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser parity - all historical editions and synchronized duel
        env:
          SATILA_SITE: docs
          SATILA_INTERACTION_QA: /tmp/satila-integration-images
          SATILA_QA_OUTPUT: /tmp/satila-integration-images/full
        run: |
          set -o pipefail
          python tests/browser_synced_scrub_acceptance.py 2>&1 | tee /tmp/satila-browser-duel.log
          python tests/browser_all_editions_acceptance.py 2>&1 | tee /tmp/satila-browser-all-editions.log
          python tests/browser_evidence_acceptance.py 2>&1 | tee /tmp/satila-browser-evidence.log
          python tests/browser_smoke.py 2>&1 | tee /tmp/satila-browser-full-page.log
      - name: Save browser logs and actual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-browser-evidence
          path: |
            /tmp/satila-integration-images/
            /tmp/satila-browser-*.log
          if-no-files-found: warn
          retention-days: 14

  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run all release gates and preserve every failure
        shell: bash
        run: |
          set +e
          python tests/test_release_copy_acceptance.py
          COPY=$?
          python tests/browser_release_navigation_acceptance.py
          NAV=$?
          python tests/browser_release_ux_acceptance.py
          UX=$?
          python tests/browser_release_pace_capability_acceptance.py
          PACE=$?
          echo "release_copy=$COPY navigation=$NAV ux=$UX pace=$PACE"
          if [ "$COPY" -ne 0 ] || [ "$NAV" -ne 0 ] || [ "$UX" -ne 0 ] || [ "$PACE" -ne 0 ]; then
            exit 1
          fi

  review-package:
    needs: [source-and-method, browser-core, release-gates]
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recheck distributable manifest, privacy and delivery budget
        run: |
          python -m unittest discover -s tests -p test_review_package_contract.py -v
          python tests/test_publication_privacy.py
          python tests/test_accessibility_performance.py
      - name: Package ONLY audited static website files from this exact passing commit
        run: |
          python - <<'PY'
          import hashlib,os,pathlib,sys,zipfile
          sys.path.insert(0,"tests")
          from test_review_package_contract import verified_manifest
          site=pathlib.Path("docs")
          entries=verified_manifest()
          output=pathlib.Path("satila-codex-integrated-review.zip")
          with zipfile.ZipFile(output,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for relative in sorted(entries):
                  z.write(site/relative,"site/"+relative)
              z.writestr("README.txt",
                  "Sätila Splits – integration review ONLY\\n"
                  "Source commit: "+os.environ["GITHUB_SHA"]+"\\n"
                  "Unzip, then: cd site && python -m http.server 8080\\n"
                  "Browse http://localhost:8080/\\n"
                  "Not published on Loppanalys.se and not approved for merge until owner review.\\n")
          digest=hashlib.sha256(output.read_bytes()).hexdigest()
          print("REVIEW ZIP PASS",len(entries),"static files",output.stat().st_size,"bytes",flush=True)
          print("SOURCE COMMIT",os.environ["GITHUB_SHA"],flush=True)
          print("ZIP SHA256",digest,flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: satila-codex-integrated-review
          path: satila-codex-integrated-review.zip
          if-no-files-found: error
          retention-days: 30
