name: Sätila replay soundtrack QA
on:
  pull_request:
    paths:
      - 'docs/assets/**'
      - 'tests/replay_music_contract.cjs'
      - '.github/workflows/replay-music-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soundtrack:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Validate JS syntax and actual music controller behavior
        run: |
          node --check docs/assets/app.js
          node tests/replay_music_contract.cjs
      - name: Complete source and publication gate
        run: python tools/run_release_candidate_checks.py --source
      - name: Browser smoke for existing replay UI
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python tests/browser_smoke.py
