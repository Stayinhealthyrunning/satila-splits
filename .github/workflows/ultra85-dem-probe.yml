name: Research historical Ultra85 elevation (Copernicus DSM)
on:
  workflow_dispatch:
  push:
    branches:
      - "research/ultra85-dem-copernicus-probe-20261002"
    paths:
      - ".github/workflows/ultra85-dem-probe.yml"
      - "tools/audit_dem_candidates.py"
permissions:
  contents: read
jobs:
  ultra85-dem-research:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install geospatial raster reader
        run: python -m pip install "rasterio>=1.3,<2"
      - name: Verify route coverage in the 57 N 12 E tile
        run: |
          python - <<'PY'
          from glob import glob
          import json
          routes = sorted(glob("docs/data/routes/*-ultra85-participant.json"))
          assert len(routes) == 7, routes
          for path in routes:
              p=json.load(open(path))["points"]
              assert all(57 < lat < 58 and 12 < lon < 13 for _,lat,lon,_ in p), path
              print(path, len(p), min(v[1] for v in p), max(v[1] for v in p),min(v[2] for v in p),max(v[2] for v in p))
          PY
      - name: Obtain public 2021 Copernicus GLO30 N57 E012 surface-model tile
        env:
          DEM_URL: https://copernicus-dem-30m.s3.amazonaws.com/Copernicus_DSM_COG_10_N57_00_E012_00_DEM/Copernicus_DSM_COG_10_N57_00_E012_00_DEM.tif
        run: |
          mkdir -p /tmp/satila-dem
          curl --fail --show-error --silent --location --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 480 "$DEM_URL" -o /tmp/satila-dem/COP30_N57E012.tif
          sha256sum /tmp/satila-dem/COP30_N57E012.tif
          python - <<'PY'
          import rasterio
          p="/tmp/satila-dem/COP30_N57E012.tif"
          with rasterio.open(p) as d:
              print("Source raster:",p,"CRS:",d.crs,"extent:",d.bounds,"count:",d.count,"nodata:",d.nodata,"size:",d.width,d.height)
              assert d.crs is not None and d.count > 0
              assert d.bounds.left < 12.18 < 12.50 < d.bounds.right
              assert d.bounds.bottom < 57.36 < 57.55 < d.bounds.top
          PY
      - name: Sample all seven exact historical route geometries
        run: |
          python tools/enrich_route_elevation.py \
            --routes docs/data/routes/*-ultra85-participant.json \
            --dem /tmp/satila-dem/COP30_N57E012.tif \
            --source-id "COPERNICUS_DEM_GLO30_PUBLIC_2021_DSM_N57E012" \
            --vertical-datum "EGM2008 (EPSG:3855)" \
            --output-dir /tmp/satila-dem/candidates
      - name: Validate height quality against organizer and participant GPX at SAME geographic coordinates
        run: |
          python tools/audit_dem_candidates.py \
            --candidate-dir /tmp/satila-dem/candidates \
            --dem /tmp/satila-dem/COP30_N57E012.tif \
            --reference docs/data/routes/ultra85-2026.json docs/data/routes/trail43-2025-2026.json docs/data/routes/2024-trail43-participant.json \
            --report /tmp/satila-dem/candidates/DEM_HEIGHT_QUALITY.json
      - name: Assert QA and retain only sanitized candidates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/satila-dem/candidates")
          qa=json.loads((p/"DEM_QA.json").read_text())
          assert len(qa)==7
          assert all(row["status"]=="COMPLETE" and row["coverage_fraction"]==1.0 for row in qa),qa
          candidates=list(p.glob("*-ultra85-participant.json"))
          assert len(candidates)==7, candidates
          for f in candidates:
              r=json.loads(f.read_text())
              assert r["elevation_provenance"]["type"]=="DEM_RECONSTRUCTED_TERRAIN"
              assert r["elevation_provenance"]["source_id"]=="COPERNICUS_DEM_GLO30_PUBLIC_2021_DSM_N57E012"
              assert all(v[3] is not None for v in r["points"])
              assert not any("timestamp" in str(k).lower() or "runner" in str(k).lower() for k in r.keys())
              values=[v[3] for v in r["points"]]
              print(f.name,len(values),"min_m",min(values),"max_m",max(values))
          (p/"PROVISIONAL_ONLY_README.txt").write_text(
            "RESEARCH ARTIFACT ONLY - NOT LIVE/PUBLIC. Copernicus DEM GLO-30 Public 2021 is a 30m DIGITAL SURFACE MODEL (includes trees/buildings), vertical datum EGM2008. NOT equal to terrain-only Lantmateriet RH2000 data. Do not publish these routes until spatial/elevation QA, licensing and disclosure have been reviewed. Original runner GPX remains private.\n",
            encoding="utf-8"
          )
          PY
      - name: Preserve provisional sanitized DEM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultra85-copernicus-dsm-provisional-20261002
          path: /tmp/satila-dem/candidates/
          if-no-files-found: warn
          retention-days: 30
