name: Prepare vetted Ultra85 DSM elevation release candidates
on:
  push:
    branches: ["feature/ultra85-filtered-dsm-elevation-20261002"]
    paths: [".github/workflows/publish-historic-ultra85-dsm.yml"]
permissions:
  contents: write
jobs:
  prepare-dem-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install licensed-open raster reader
        run: python -m pip install "rasterio>=1.3,<2"
      - name: Reproduce pinned Copernicus GLO-30 Public 2021 tile
        run: |
          mkdir -p /tmp/dem-release
          curl --fail --show-error --silent --location --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 480 \
            https://copernicus-dem-30m.s3.amazonaws.com/Copernicus_DSM_COG_10_N57_00_E012_00_DEM/Copernicus_DSM_COG_10_N57_00_E012_00_DEM.tif \
            -o /tmp/dem-release/COP30_N57E012.tif
          echo '4a5eef5035a20fc434ea64af82e0565f52777cb36016ae209223bee024404eba  /tmp/dem-release/COP30_N57E012.tif' | sha256sum -c
      - name: Reproduce seven provisional 2D-to-DSM samples
        run: |
          python tools/enrich_route_elevation.py \
            --routes docs/data/routes/*-ultra85-participant.json \
            --dem /tmp/dem-release/COP30_N57E012.tif \
            --source-id "COPERNICUS_DEM_GLO30_PUBLIC_2021_DSM_N57E012" \
            --vertical-datum "EGM2008 (EPSG:3855)" \
            --output-dir /tmp/dem-release/raw
          python tools/refine_dem_profile.py \
            --input-dir /tmp/dem-release/raw \
            --output-dir /tmp/dem-release/refined
          python tools/audit_dem_candidates.py \
            --candidate-dir /tmp/dem-release/refined \
            --dem /tmp/dem-release/COP30_N57E012.tif \
            --reference docs/data/routes/ultra85-2026.json docs/data/routes/trail43-2025-2026.json docs/data/routes/2024-trail43-participant.json \
            --report /tmp/dem-release/DEM_RELEASE_QUALITY.json
      - name: Explicit independent publication gate and inventory lineage
        run: |
          python - <<'PY'
          import json, math, shutil
          from pathlib import Path
          root=Path("/tmp/dem-release")
          qa=json.loads((root/"raw/DEM_QA.json").read_text())
          assert len(qa)==7 and all(v["status"]=="COMPLETE" and v["coverage_fraction"]==1.0 for v in qa)
          report=json.loads((root/"DEM_RELEASE_QUALITY.json").read_text())
          ref={v["reference"]:v for v in report["source_reference_validation"]}
          for filename,allow_p90,allow_gain in [
              ("ultra85-2026.json",12.,.10),
              ("trail43-2025-2026.json",12.,.10),
              ("2024-trail43-participant.json",20.,.12)
          ]:
              x=ref[filename]
              assert x["dsm_sample_coverage"]==1.0, x
              assert x["filtered_abs_residual_p90_m"]<=allow_p90, x
              ref_gain=x["reference_100m_resampled_positive_gain_m"]
              calc=x["filtered_dsm_100m_resampled_positive_gain_m"]
              assert abs(calc-ref_gain)/ref_gain<=allow_gain,x
              print("GPX_REFERENCE_QA",filename,"source_gain",ref_gain,"smoothed_surface_gain",calc,
                    "p90_height_error",x["filtered_abs_residual_p90_m"],flush=True)
          accepted={}
          stats=report["historical_candidate_checks"]
          assert len(stats)==7
          for x in stats:
              assert x["short_step_abs_jump_p95_m"]<9., x
              assert x["short_step_jumps_over_20m"]<=1, x
              assert x["very_steep_pairs_over_80_percent"]==0, x
              path=root/"refined"/x["route"]
              after=json.loads(path.read_text())
              before=json.loads((Path("docs/data/routes")/x["route"]).read_text())
              assert after["elevation_provenance"]["type"]=="DSM_RECONSTRUCTED_SURFACE"
              assert after["elevation_provenance"]["surface_not_ground"] is True
              assert after["source_sha256"]==before["source_sha256"],x
              assert after["geometry_length_km"]==before["geometry_length_km"],x
              assert all(q[:3]==p[:3] for q,p in zip(before["points"],after["points"])),x
              assert len(after["points"])==len(before["points"])==x["points"],x
              assert all(isinstance(p[3],(int,float)) and math.isfinite(p[3]) for p in after["points"]),x
              assert not any("time" in field.lower() or "name" in field.lower() for field in after.keys()),x
              accepted[after["race_key"]]=after
              shutil.copyfile(path,Path("docs/data/routes")/x["route"])
              print("ACCEPTED",x["route"],x["points"],flush=True)
          assert len(accepted)==7
          inventory_path=Path("docs/data/route-inventory.json")
          inventory=json.loads(inventory_path.read_text())
          count=0
          for row in inventory:
              key=row.get("race_key")
              if key in accepted:
                  count+=1
                  row["elevation_available"]=True
                  row["elevation_source_kind"]="RECONSTRUCTED_COPERNICUS_DSM_GLO30_2021"
                  row["elevation_vertical_datum"]="EGM2008 (EPSG:3855)"
                  row["elevation_is_surface_not_ground"]=True
                  row["elevation_filter"]="uniform-distance-resampling-20m-and-Gaussian-sigma-65m"
          assert count==7,count
          inventory_path.write_text(json.dumps(inventory,ensure_ascii=False,separators=(",",":"))+"\n",encoding="utf8")
          report["release_decision"]="ACCEPTED_AS_APPROXIMATE_FILTERED_DSM_SURFACE_PROFILE_ONLY"
          report["dataset"]="Copernicus DEM GLO-30 Public 2021, 30m digital surface model"
          report["pinned_tile_sha256"]="4a5eef5035a20fc434ea64af82e0565f52777cb36016ae209223bee024404eba"
          report["original_source_geometry_and_eqtiming"]="UNCHANGED"
          report["official_ascent"]="NOT_RECONSTRUCTED_OR_VALIDATED"
          report["attribution"]="produced using Copernicus WorldDEM-30 © DLR e.V. 2010-2014 and © Airbus Defence and Space GmbH 2014-2018 provided under COPERNICUS by the European Union and ESA; all rights reserved"
          Path("reports/ULTRA85_DSM_RELEASE_QA_2026-10-02.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf8")
          PY
      - name: Execute full source gate before committing any web content
        run: |
          node --check docs/assets/app.js
          python tools/run_release_candidate_checks.py --source
      - name: Install headless Chromium and verify all seven elevation displays
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python tests/browser_ultra85_historical_routes_acceptance.py
      - name: Commit ONLY validated sanitized JSON and report to candidate branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/routes/*-ultra85-participant.json docs/data/route-inventory.json reports/ULTRA85_DSM_RELEASE_QA_2026-10-02.json
          git diff --cached --check
          git commit -m "data: release QA-vetted year-specific Ultra85 Copernicus DSM surface elevation"
          git push origin HEAD:refs/heads/feature/ultra85-filtered-dsm-elevation-20261002
      - name: Preserve QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultra85-filtered-dsm-release-qa
          path: |
            /tmp/dem-release/DEM_RELEASE_QUALITY.json
            /tmp/dem-release/raw/DEM_QA.json
          if-no-files-found: warn
          retention-days: 30
