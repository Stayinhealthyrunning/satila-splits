name: Discover historical EQ Timing events
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/inspect_eqtiming_eventlist.py'
      - '.github/workflows/discover-eqtiming-history.yml'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - run: python tools/inspect_eqtiming_eventlist.py
      - uses: actions/upload-artifact@v4
        with:
          name: satila-eqtiming-history-${{ github.run_id }}
          path: data/work/eqtiming-discovery/
          if-no-files-found: error
          retention-days: 30
