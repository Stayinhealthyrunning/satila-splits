name: Build Sätila first-draft data
on:
  workflow_dispatch:
  push:
    branches: ["build/full-first-draft-2026-10-01"]
    paths:
      - ".github/workflows/build-first-draft.yml"
      - "tools/build_satila.py"
      - "tools/fetch_organizer_gpx.py"
      - "config/eqtiming-events.json"
      - "config/source-registry.json"
permissions:
  contents: write
  actions: read
concurrency:
  group: satila-first-draft-data
  cancel-in-progress: false
jobs:
  build-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/full-first-draft-2026-10-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download verified EQ Timing source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/satila-eq data/work/eqtiming-full
          mkdir -p /tmp/satila-eq data/work
          gh run download 36818159977 --repo "${{ github.repository }}" --name satila-eqtiming-raw-36818159977 --dir /tmp/satila-eq
          test -d /tmp/satila-eq/eqtiming-full
          mv /tmp/satila-eq/eqtiming-full data/work/eqtiming-full
      - name: Fetch checksum-locked organizer GPX
        run: python tools/fetch_organizer_gpx.py
      - name: Build browser data
        run: python tools/build_satila.py
      - name: Validate public bundle
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path("docs/data")
          boot=json.loads((root/"bootstrap.json").read_text())
          assert len(boot["editions"])==27, len(boot["editions"])
          assert sum(e["results"] for e in boot["editions"])==3272
          race_files=list((root/"races").glob("*.json"))
          assert len(race_files)==27, len(race_files)
          for e in boot["editions"]:
              p=root/"races"/f"{e['race_key']}.json"
              race=json.loads(p.read_text())
              ids=[r["id"] for r in race["results"]]
              assert len(ids)==len(set(ids))
              assert all(s["elapsed_seconds"]>0 for s in race["splits"])
              if e["year"]<2025:
                  assert not e.get("route_file"), (e["race_key"],e.get("route_file"))
          assert (root/"routes"/"trail22-2025-2026.json").exists()
          assert (root/"routes"/"trail43-2025-2026.json").exists()
          print("validated",len(boot["editions"]),"editions,",sum(e["results"] for e in boot["editions"]),"results")
          PY
          rm -f docs/data/satila.sqlite
      - name: Commit generated web data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No generated data changes."
          else
            git commit -m "S1-S3: generate verified EQ Timing web bundles [skip ci]"
            git push origin HEAD:build/full-first-draft-2026-10-01
          fi
