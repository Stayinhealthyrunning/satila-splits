name: Fetch public GPX research sources

on:
  push:
    branches:
      - setup/foundation
    paths:
      - ".github/workflows/fetch-public-gpx.yml"
      - "tools/fetch_public_gpx.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and validate public GPX sources
        run: python tools/fetch_public_gpx.py

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: satila-public-gpx-research
          path: research-artifacts/
          if-no-files-found: error
          retention-days: 30
