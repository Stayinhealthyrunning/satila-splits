name: Finalize recovered historical 43 km routes
on:
  push:
    branches:
      - feature/restore-normalized-43km-2021-2025
    paths:
      - tools/finalize_normalized_43_routes.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize-metadata-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify sources and complete edition coverage/registry metadata
        run: python tools/finalize_normalized_43_routes.py
      - name: Save finalized metadata as a distinct checkpoint commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/coverage.json config/source-registry.json
          if git diff --cached --quiet; then echo "Already finalized"; else
            git commit -m "Finalize all 2021-2023 normalized course metadata"
            for attempt in 1 2 3 4 5; do
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase "origin/${GITHUB_REF_NAME}"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
            done
          fi
      - name: Static JavaScript checks
        run: node --check docs/assets/app.js
      - name: Complete release source tests against committed finalized data
        run: python tools/run_release_candidate_checks.py --source
