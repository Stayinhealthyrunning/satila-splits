name: Integrate historical ultra85 maps 2018–2025
on:
  pull_request:
    branches: [main]
    paths:
      - 'data/derived/ultra85-2018-2025-sanitized.zlib.b64'
      - 'tools/import_ultra85_history.py'
      - 'tools/run_release_candidate_checks.py'
      - 'tests/test_ultra85_historic_routes.py'
      - 'tests/browser_ultra85_history_acceptance.py'
      - 'docs/assets/app.js'
      - '.github/workflows/import-ultra85-history.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ultra85-historic-import-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  map-import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium acceptance runtime
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Decode seven sanitized year-locked route maps
        run: python tools/import_ultra85_history.py
      - name: Seven-year provenance, privacy and complete source regression
        run: |
          node --check docs/assets/app.js
          python tests/test_ultra85_historic_routes.py
          python tools/run_release_candidate_checks.py --source
      - name: Chromium QA including missing-source-elevation and unrelated routes
        run: |
          SATILA_SITE=docs python tests/browser_ultra85_history_acceptance.py
          SATILA_SITE=docs python tests/browser_all_editions_acceptance.py
          SATILA_SITE=docs python tests/browser_43km_all_routed_years_acceptance.py
      - name: Persist only sanitized output and public provenance on PR branch
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data config/source-registry.json
          if git diff --cached --quiet; then
            echo "Already imported; route output checksum stable."
            exit 0
          fi
          git commit -m "Integrate seven accepted historic 85 km display routes (2018–2025)"
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
